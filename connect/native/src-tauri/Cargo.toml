[package]
name = "mdtero-connect-desktop"
version = "0.1.0"
description = "Mdtero Connect desktop client"
edition = "2021"
license = "MIT"

[lib]
name = "mdtero_connect_desktop"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "mdtero-connect-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
debug = false
strip = true
lto = true
codegen-units = 1
