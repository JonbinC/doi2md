[project]
name = "mdtero"
version = "0.3.4"
description = "Turn research papers into structured Markdown for reading, translation, and local agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mdtero" }]
dependencies = [
  "curl_cffi>=0.7",
  "fastmcp>=2",
  "httpx>=0.27",
  "pyzotero>=1.5",
  "requests>=2.31",
  "rich>=13.7",
  "socksio>=1.0",
  "textual>=0.80",
  "websockets>=14",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.optional-dependencies]
connect-full = ["keyring>=25.7,<27"]

[project.urls]
Homepage = "https://mdtero.com"
Repository = "https://github.com/JonbinC/doi2md"

[project.scripts]
mdtero = "mdtero.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdtero"]

[tool.hatch.build.targets.wheel.force-include]
"connect/app" = "mdtero/connect/static"
"connect/agent/worker.mjs" = "mdtero/connect/agent/worker.mjs"
"connect/agent/package.json" = "mdtero/connect/agent/package.json"
"connect/agent/package-lock.json" = "mdtero/connect/agent/package-lock.json"
"connect/agent/README.md" = "mdtero/connect/agent/README.md"
"connect/agent/THIRD_PARTY_NOTICES.md" = "mdtero/connect/agent/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["src"]
