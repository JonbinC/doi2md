name: Connect handoff design checks
on:
  pull_request:
    paths:
      - 'connect/**'
      - 'src/mdtero/connect/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests_py/test_connect_*.py'
      - '.github/workflows/connect-handoff.yml'
      - '.github/workflows/connect-release.yml'
      - '.github/actionlint.yaml'
      - 'scripts/ci/prepare_connect_release.py'
  push:
    branches:
      - handoff/connect-research-client-20261021
    paths:
      - 'connect/**'
      - 'src/mdtero/connect/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests_py/test_connect_*.py'
      - '.github/workflows/connect-handoff.yml'
      - '.github/workflows/connect-release.yml'
      - '.github/actionlint.yaml'
      - 'scripts/ci/prepare_connect_release.py'
permissions:
  contents: read
jobs:
  workflow-lint:
    name: Validate Connect Actions workflows
    # Same-repo events run on the mdtero box; fork PRs stay on GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mdtero-box"]') || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Lint release and PR workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/connect-release.yml .github/workflows/connect-native-debug.yml .github/workflows/connect-handoff.yml
  design:
    # Same-repo events run on the mdtero box; fork PRs stay on GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mdtero-box"]') || 'ubuntu-latest' }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline design JS syntax
        run: |
          node --check connect/design/policy.js
          node --check connect/design/app.js
          node --check connect/app/api.js
          node --check connect/app/app.js
      - name: Original 26 design-policy regressions
        run: node --test connect/design/policy.test.cjs
      - name: Static entry and safe mock-only checks
        run: |
          test -s connect/design/index.html
          test -s connect/design/style.css
          grep -q "connect-src 'none'" connect/design/index.html
          if grep -Eq 'https?://[^" ]+' connect/design/app.js; then
            echo "offline design bundle must not contain remote URLs"
            exit 1
          fi
          grep -q "connect-src 'self'" connect/app/index.html
          test -s connect/app/api.js
  bridge:
    # Same-repo events run on the mdtero box; fork PRs stay on GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mdtero-box"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Connect bridge and security tests
        run: |
          uv sync --frozen
          uv run pytest tests_py/test_connect_*.py -q
  pi-readonly:
    # Same-repo events run on the mdtero box; fork PRs stay on GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mdtero-box"]') || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: connect/agent/package-lock.json
      - name: Install pinned Pi SDK dependencies
        run: npm ci --prefix connect/agent --ignore-scripts
      - name: Exercise read-only Pi adapter without provider calls
        run: npm test --prefix connect/agent
  live-ui:
    # Same-repo events run on the mdtero box; fork PRs stay on GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mdtero-box"]') || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connect/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install live UI test dependencies
        run: |
          uv sync --frozen
          npm ci --prefix connect
          npx --prefix connect playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Exercise the live loopback UI with synthetic upstream data
        run: npm --prefix connect test
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connect-live-ui-failure
          path: connect/test-results/
          if-no-files-found: ignore
          retention-days: 7
