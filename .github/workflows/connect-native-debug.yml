name: Connect native debug artifacts

on:
  pull_request:
    paths:
      - 'connect/**'
      - 'src/mdtero/**'
      - 'relay/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests_py/test_connect_*.py'
      - '.github/workflows/connect-native-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-native-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-basic:
    name: Linux basic source verification
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Verify basic client and artifact collector
        run: |
          uv sync --frozen
          uv run pytest tests_py/test_connect_*.py -q
          uv run python scripts/ci/secret_guard.py
          uv run mdtero connect --help

  native:
    name: Debug bundle (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app
          - id: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - id: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            connect/native/package-lock.json
            connect/agent/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: relay/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install locked build and Pi dependencies
        run: |
          uv sync --frozen --extra connect-full
          npm --prefix connect/native ci --ignore-scripts
          npm --prefix connect/agent ci --ignore-scripts
      - name: Verify bridge and real Pi SDK with synthetic services
        run: |
          uv run pytest tests_py/test_connect_*.py -q
          npm --prefix connect/agent test
      - name: Freeze bridge and bundle local Relay, Node and Pi
        run: uv run --extra connect-full --with pyinstaller==6.19.0 python connect/native/prepare.py --target ${{ matrix.target }} --edition full
      - name: Build native debugging payload
        run: |
          cargo test --locked --manifest-path connect/native/src-tauri/Cargo.toml --lib --target ${{ matrix.target }}
          npm --prefix connect/native run build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect payload, checksums and source provenance
        run: uv run python connect/native/collect_artifacts.py --target ${{ matrix.target }} --edition full
      - name: Upload debugging payload; no release publication
        uses: actions/upload-artifact@v4
        with:
          name: mdtero-connect-debug-${{ matrix.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: connect/native/dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
