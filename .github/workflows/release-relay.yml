name: Release Campus Relay

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Relay semver to release, for example 0.1.9"
        required: true
        default: "0.1.9"
  push:
    branches:
      - main
    paths:
      - relay/cmd/mdtero-relay/main.go
    tags:
      - "relay/v*"

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve relay version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: python scripts/ci/release_policy.py resolve relay
      - name: Check existing Relay release
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_KIND: relay
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: python scripts/ci/release_policy.py check-github

  test:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: relay/go.sum
      - working-directory: relay
        run: go test ./...

  build:
    needs: [resolve, test]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact: mdtero-relay-darwin-arm64
          - goos: darwin
            goarch: amd64
            artifact: mdtero-relay-darwin-amd64
          - goos: linux
            goarch: arm64
            artifact: mdtero-relay-linux-arm64
          - goos: linux
            goarch: amd64
            artifact: mdtero-relay-linux-amd64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: mdtero-relay-linux-armv7
          - goos: windows
            goarch: amd64
            artifact: mdtero-relay-windows-amd64
          - goos: windows
            goarch: arm64
            artifact: mdtero-relay-windows-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: relay/go.sum
      - name: Build archive
        working-directory: relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELAY_VERSION: ${{ needs.resolve.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [[ -z "${GOARM}" ]]; then
            unset GOARM
          fi
          mkdir -p "dist/v${RELAY_VERSION}/browser_worker"
          cp browser_worker/mdtero_browser_worker.py "dist/v${RELAY_VERSION}/browser_worker/"
          cp browser_worker/requirements.txt "dist/v${RELAY_VERSION}/browser_worker/"
          output="dist/v${RELAY_VERSION}/mdtero-relay"
          archive_members=(mdtero-relay browser_worker)
          if [[ "$GOOS" == "windows" ]]; then
            output="${output}.exe"
            archive_members=(mdtero-relay.exe browser_worker)
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${RELAY_VERSION}" -o "$output" ./cmd/mdtero-relay
          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            got="$("$output" version)"
            echo "$got"
            [[ "$got" == "mdtero-relay ${RELAY_VERSION}" ]]
          fi
          if [[ "$GOOS" == "linux" && "$GOARCH" == "arm" ]]; then
            file "$output" | grep -q 'ARM'
          fi
          tar -C "dist/v${RELAY_VERSION}" -czf "dist/v${RELAY_VERSION}/${ARTIFACT}.tgz" "${archive_members[@]}"
          listing="$(tar -tzf "dist/v${RELAY_VERSION}/${ARTIFACT}.tgz")"
          printf '%s\n' "$listing" | grep -qx "${archive_members[0]}"
          printf '%s\n' "$listing" | grep -qx 'browser_worker/mdtero_browser_worker.py'
          printf '%s\n' "$listing" | grep -qx 'browser_worker/requirements.txt'
          rm -rf "dist/v${RELAY_VERSION}/browser_worker" "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: relay/dist/v${{ needs.resolve.outputs.version }}/${{ matrix.artifact }}.tgz

  github-release:
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-github-relay-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: relay/dist/v${{ needs.resolve.outputs.version }}
          merge-multiple: true
      - name: Require every platform archive
        env:
          RELAY_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          target="relay/dist/v${RELAY_VERSION}"
          expected=(
            mdtero-relay-darwin-amd64.tgz
            mdtero-relay-darwin-arm64.tgz
            mdtero-relay-linux-amd64.tgz
            mdtero-relay-linux-arm64.tgz
            mdtero-relay-linux-armv7.tgz
            mdtero-relay-windows-amd64.tgz
            mdtero-relay-windows-arm64.tgz
          )
          missing=0
          for name in "${expected[@]}"; do
            if [[ ! -f "$target/$name" ]]; then
              echo "missing release archive: $name" >&2
              missing=1
            fi
          done
          find "$target" -name '*.tgz' -printf '%f\n' | sort
          [[ "$missing" -eq 0 ]]
      - name: Recheck Relay release before publishing
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_KIND: relay
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: python scripts/ci/release_policy.py check-github
      - uses: softprops/action-gh-release@v2
        if: steps.publish.outputs.publish == 'true'
        with:
          tag_name: relay/v${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          overwrite_files: false
          name: mdtero-relay v${{ needs.resolve.outputs.version }}
          files: relay/dist/v${{ needs.resolve.outputs.version }}/*.tgz
